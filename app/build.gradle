apply plugin: 'com.android.application'
apply plugin: 'com.diffplug.spotless'
apply plugin: 'jacoco'

android {
    namespace 'com.gasleakdetector'
    compileSdk 35

    defaultConfig {
        applicationId "com.gasleakdetector"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile     file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias      System.getenv("KEY_ALIAS") ?: ""
            keyPassword   System.getenv("KEY_PASSWORD") ?: ""
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'

            if (System.getenv("KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
                      '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/code-coverage/connected/*coverage.ec'
    ]))
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0'
    }
}

spotless {
    java {
        googleJavaFormat()
        target 'src/**/*.java'
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.7.1') {
        exclude group: 'androidx.annotation', module: 'annotation-experimental'
    }
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    implementation('org.java-websocket:Java-WebSocket:1.6.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    // slf4j-android routes slf4j calls to android.util.Log; required because
    // Java-WebSocket uses slf4j internally but we exclude the API jar above.
    implementation 'org.slf4j:slf4j-android:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
