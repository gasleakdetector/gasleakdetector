buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {

        classpath 'com.android.tools.build:gradle:9.5.1'

        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.11.0'
        classpath 'androidx.benchmark:benchmark-gradle-plugin:1.5.0'

    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
